<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>销售分析 - 大数据平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif;
    background:#fff;color:#2c3e5c;font-size:14px;
  }

  /* ===== 顶部导航 ===== */
  .topbar{
    position:sticky;top:0;z-index:50;display:flex;align-items:stretch;height:58px;
    background:#1890ff;
    box-shadow:0 2px 10px rgba(24,144,255,.32);
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 18px;min-width:218px;border-right:1px solid rgba(255,255,255,.12)}
  .logo{
    width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.16);color:#fff;font-size:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.2}
  .brand-text strong{color:#fff;font-size:16px;letter-spacing:1px}
  .brand-text small{color:rgba(255,255,255,.72);font-size:9px;letter-spacing:1.6px}
  .main-nav{flex:1;display:flex;align-items:center;overflow-x:auto;scrollbar-width:none;padding:0 6px}
  .main-nav::-webkit-scrollbar{display:none}
  .nav-item{
    flex-shrink:0;height:58px;display:flex;align-items:center;padding:0 14px;position:relative;
    color:rgba(255,255,255,.82);font-size:14px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;
  }
  .nav-item:hover{color:#fff;background:rgba(255,255,255,.08)}
  .nav-item.active{color:#fff;font-weight:600;background:rgba(255,255,255,.18)}
  .nav-item.active::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;background:#fff;border-radius:3px 3px 0 0}
  .top-actions{display:flex;align-items:center;gap:14px;padding:0 16px 0 14px;min-width:330px}
  .search-box{position:relative;width:220px}
  .search-box i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.75);font-size:13px}
  .search-box input{
    width:100%;height:32px;border:1px solid rgba(255,255,255,.35);border-radius:16px;background:rgba(255,255,255,.14);
    color:#fff;padding:0 12px 0 30px;font-size:13px;outline:none;transition:.2s;
  }
  .search-box input::placeholder{color:rgba(255,255,255,.72)}
  .search-box input:focus{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.7)}
  .icon-btn{
    position:relative;width:32px;height:32px;border:none;border-radius:50%;background:rgba(255,255,255,.12);
    color:#fff;font-size:15px;cursor:pointer;transition:.2s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.24)}
  .icon-btn .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:#ffd34d;border:1px solid #0a2c6c}
  .avatar{
    width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#ffb45e,#ff7b54);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;
    box-shadow:0 0 0 2px rgba(255,255,255,.35);cursor:pointer;
  }

  /* ===== 页面主体 ===== */
  .page{max-width:1720px;margin:0 auto;padding:18px 22px 30px}
  .tab-bar{background:#fff;border-bottom:1px solid #e7edf6;padding:10px 22px 0}
  .tab{
    display:inline-flex;align-items:center;height:36px;padding:0 24px;background:#1890ff;color:#fff;
    font-size:14px;font-weight:600;border-radius:6px 6px 0 0;box-shadow:0 -2px 6px rgba(24,144,255,.12);
  }

  /* ===== 筛选区 ===== */
  .filter-panel{background:#fff;padding:16px 18px 14px}
  .filter-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 18px}
  .hidden{display:none!important}
  .form-item{display:flex;align-items:center;gap:8px;min-width:0}
  .form-label{flex:0 0 112px;text-align:right;font-size:12px;color:#55637c;white-space:nowrap}
  .form-label.changed{color:#e5484d;font-weight:600}
  .control{
    height:32px;width:100%;min-width:0;border:1px solid #ccd8e8;border-radius:4px;background:#fff;
    padding:0 8px;font-size:13px;color:#2c3e5c;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .control:focus{border-color:#2f7fe0;box-shadow:0 0 0 3px rgba(47,127,224,.14)}
  .control:disabled{background:#eef2f7;color:#9aa7bd;cursor:not-allowed}
  select.control option.red{color:#e5484d;font-weight:600}
  .range-group{display:flex;align-items:center;gap:6px;width:100%}
  .range-group input{flex:1;min-width:0}
  .range-group span{color:#8a97ad;font-size:12px;flex-shrink:0}
  .input-unit{position:relative;flex:1;min-width:0;display:flex}
  .input-unit input{padding-right:26px}
  .input-unit span{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    color:#8a97ad;font-size:12px;pointer-events:none;
  }
  .dpr{position:relative;width:100%;min-width:0}
  .dpr-trigger{
    width:100%;height:32px;display:flex;align-items:center;justify-content:space-between;gap:6px;
    border:1px solid #ccd8e8;border-radius:4px;background:#fff;padding:0 8px;font-size:13px;
    color:#2c3e5c;cursor:pointer;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .dpr-trigger:hover{border-color:#9fb6d4}
  .dpr-trigger .dpr-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}
  .dpr-trigger i{color:#8a97ad;font-size:13px;flex-shrink:0}
  .dpr.open .dpr-trigger{border-color:#1890ff;box-shadow:0 0 0 3px rgba(24,144,255,.15)}
  .dpr-panel{
    position:absolute;top:34px;left:0;z-index:30;width:286px;background:#fff;
    border:1px solid #d5e0ee;border-radius:6px;box-shadow:0 8px 20px rgba(20,45,90,.16);padding:10px;
  }
  .dpr-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .dpr-head button{
    width:24px;height:24px;border:1px solid #d5e0ee;border-radius:4px;background:#fff;
    color:#42536f;cursor:pointer;font-size:13px;line-height:1;
  }
  .dpr-month{font-size:13px;color:#1d3358;font-weight:600}
  .dpr-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:#8a97ad;margin-bottom:4px}
  .dpr-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .dpr-day{
    height:28px;border:none;background:none;border-radius:4px;font-size:12px;color:#2c3e5c;cursor:pointer;
  }
  .dpr-day:hover{background:#f0f6ff}
  .dpr-day.in-range{background:#e8f2ff;border-radius:0}
  .dpr-day.start,.dpr-day.end{background:#1890ff;color:#fff;font-weight:600;border-radius:4px}
  .dpr-empty{height:28px}
  .dpr-foot{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid #eef2f8}
  .dpr-foot button{
    border:1px solid #d5e0ee;border-radius:4px;background:#fff;color:#42536f;
    font-size:12px;padding:4px 10px;cursor:pointer;
  }
  .dpr-foot button:hover{border-color:#8fb0da;color:#1890ff}
  .msel{position:relative;width:100%;min-width:0}
  .msel-trigger{
    width:100%;height:32px;display:flex;align-items:center;justify-content:space-between;gap:6px;
    border:1px solid #ccd8e8;border-radius:4px;background:#fff;padding:0 8px;font-size:13px;
    color:#2c3e5c;cursor:pointer;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .msel-trigger:hover{border-color:#9fb6d4}
  .msel-trigger .msel-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left}
  .msel-trigger i{color:#8a97ad;font-size:12px;flex-shrink:0;transition:transform .15s}
  .msel.open .msel-trigger{border-color:#1890ff;box-shadow:0 0 0 3px rgba(24,144,255,.15)}
  .msel.open .msel-trigger i{transform:rotate(180deg)}
  .msel-panel{
    position:absolute;top:34px;left:0;z-index:30;width:max-content;min-width:100%;max-width:300px;
    background:#fff;border:1px solid #d5e0ee;border-radius:6px;box-shadow:0 8px 20px rgba(20,45,90,.16);
  }
  .msel-head{
    display:flex;align-items:center;justify-content:space-between;padding:8px 10px;
    border-bottom:1px solid #eef2f8;font-size:12px;color:#42536f;
  }
  .msel-all-row{display:flex;align-items:center;gap:5px;cursor:pointer}
  .msel-all-row input,.msel-opt input{accent-color:#1890ff;width:14px;height:14px;flex-shrink:0}
  .msel-clear{border:none;background:none;color:#1890ff;font-size:12px;cursor:pointer;padding:2px 4px}
  .msel-list{max-height:240px;overflow:auto;padding:4px}
  .msel-opt{
    display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:4px;
    font-size:13px;color:#2c3e5c;cursor:pointer;white-space:nowrap;
  }
  .msel-opt:hover{background:#f0f6ff}
  .radio-group{display:flex;align-items:center;gap:14px;white-space:nowrap}
  .radio-group label{display:flex;align-items:center;gap:5px;font-size:13px;color:#42536f;cursor:pointer}
  .radio-group input{accent-color:#1769e0;width:14px;height:14px}
  .filter-actions{display:flex;align-items:center;gap:10px;margin-top:14px}
  .btn{
    height:32px;padding:0 20px;border-radius:4px;border:1px solid #ccd7e6;background:#fff;color:#4b5b76;
    font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;
    box-shadow:0 1px 2px rgba(20,45,90,.06);
  }
  .btn:hover{border-color:#9fb6d4;color:#1d3358}
  .btn.primary{
    background:linear-gradient(180deg,#2d7fe0,#1769d6);border-color:#1769d6;color:#fff;
    box-shadow:0 2px 6px rgba(23,105,214,.28);
  }
  .btn.primary:hover{background:linear-gradient(180deg,#2373d2,#115bc0)}
  .btn.small{height:28px;padding:0 12px;font-size:12px}

  /* ===== 表格区 ===== */
  .section-divider{height:1px;background:#dfe5ee;margin:16px 0}
  .table-panel{background:#fff}
  .table-wrap{overflow:auto;max-height:calc(100vh - 330px);min-height:280px}
  table{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  thead th{
    position:sticky;top:0;z-index:3;background:#edf3fb;color:#23406c;font-weight:600;
    padding:10px 12px;border-bottom:1px solid #d3deee;white-space:nowrap;
  }
  thead th.changed{color:#e5484d}
  tbody td{padding:9px 12px;border-bottom:1px solid #eef2f8;white-space:nowrap}
  tbody tr:nth-child(even) td{background:#f7fafd}
  tbody tr:nth-child(odd) td{background:#fff}
  tbody tr:hover td{background:#e9f2ff}
  tr.total-row td{background:#eaf3ff;font-weight:600;color:#1d3358;border-top:2px solid #d3deee}
  tr.total-row:hover td{background:#eaf3ff}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  th.sticky,td.sticky{position:sticky;box-shadow:1px 0 0 #d9e3f1}
  th.sticky-1,td.sticky-1{left:0;width:150px;min-width:150px;max-width:150px}
  th.sticky-2,td.sticky-2{left:150px;width:150px;min-width:150px;max-width:150px}
  td.sticky{z-index:2}
  thead th.sticky{z-index:6}

  /* ===== 分页 ===== */
  .pagination{
    display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;
    border-top:1px solid #e7edf6;font-size:13px;color:#5a6b85;
  }
  .pagination-left{display:flex;align-items:center}
  .pagination-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .pagination b{color:#1d3358;font-weight:600}
  .page-size{height:28px;border:1px solid #ccd8e8;border-radius:4px;background:#fff;padding:0 6px;font-size:12px;color:#42536f;outline:none}
  .page-btn{
    width:28px;height:28px;border:1px solid #ccd8e8;border-radius:4px;background:#fff;color:#42536f;
    cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .page-btn:hover:not(:disabled){border-color:#8fb0da;color:#1769d6}
  .page-btn:disabled{opacity:.45;cursor:not-allowed}
  .page-numbers{display:flex;gap:6px;align-items:center}
  .page-num{
    min-width:28px;height:28px;padding:0 6px;border:1px solid transparent;border-radius:4px;background:transparent;
    color:#42536f;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;
  }
  .page-num:hover{border-color:#ccd8e8;background:#f5f8fc}
  .page-num.active{background:#1769d6;color:#fff;font-weight:600}
  .page-ellipsis{color:#8a97ad;padding:0 2px}
  .go{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .go input{
    width:52px;height:28px;border:1px solid #ccd8e8;border-radius:4px;text-align:center;font-size:12px;
    color:#2c3e5c;outline:none;
  }
  .go input:focus{border-color:#2f7fe0;box-shadow:0 0 0 3px rgba(47,127,224,.12)}

  /* ===== 响应式 ===== */
  @media (max-width:1360px){.filter-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media (max-width:1120px){
    .filter-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    .top-actions{min-width:0}
    .search-box{width:170px}
  }
  @media (max-width:900px){
    .filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .brand{min-width:auto}
    .page-head{flex-direction:column;align-items:flex-start}
  }
  @media (max-width:640px){
    .filter-grid{grid-template-columns:1fr}
    .top-actions .icon-btn{display:none}
    .page{padding:12px}
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo"><i class="fa-solid fa-database"></i></span>
    <span class="brand-text">
      <strong>大数据平台</strong>
      <small>BIG DATA PLATFORM</small>
    </span>
  </div>
  <nav class="main-nav">
    <span class="nav-item">系统管理</span>
    <span class="nav-item">经营看板</span>
    <span class="nav-item active">销售分析</span>
    <span class="nav-item">进销存分析</span>
    <span class="nav-item">库存分析</span>
    <span class="nav-item">顾客分析</span>
    <span class="nav-item">采购分析</span>
    <span class="nav-item">提货分析</span>
    <span class="nav-item">风险管控</span>
    <span class="nav-item">离线分析</span>
  </nav>
  <div class="top-actions">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" placeholder="搜索菜单、报表、指标">
    </div>
    <button class="icon-btn" title="消息通知"><i class="fa-regular fa-bell"></i><span class="dot"></span></button>
    <div class="avatar">木</div>
  </div>
</header>

<div class="tab-bar">
  <div class="tab">销售汇总表</div>
</div>

<main class="page">
  <section class="filter-panel">
    <div class="filter-grid">
      <div class="form-item">
        <label class="form-label">渠道</label>
        <div class="msel" id="mselChannel">
          <button type="button" class="msel-trigger"><span class="msel-label">全部</span><i class="fa-solid fa-angle-down"></i></button>
          <div class="msel-panel hidden">
            <div class="msel-head">
              <label class="msel-all-row"><input type="checkbox" class="msel-all" checked> 全选</label>
              <button type="button" class="msel-clear">清空</button>
            </div>
            <div class="msel-list"></div>
          </div>
        </div>
      </div>
      <div class="form-item">
        <label class="form-label">门店</label>
        <div class="msel" id="mselStore">
          <button type="button" class="msel-trigger"><span class="msel-label">全部</span><i class="fa-solid fa-angle-down"></i></button>
          <div class="msel-panel hidden">
            <div class="msel-head">
              <label class="msel-all-row"><input type="checkbox" class="msel-all" checked> 全选</label>
              <button type="button" class="msel-clear">清空</button>
            </div>
            <div class="msel-list"></div>
          </div>
        </div>
      </div>
      <div class="form-item">
        <label class="form-label">分析维度</label>
        <select class="control" id="analysisDim"></select>
      </div>
      <div class="form-item">
        <label class="form-label">叠加维度</label>
        <select class="control" id="overlayDim"></select>
      </div>
      <div class="form-item">
        <label class="form-label changed">效率指标</label>
        <select class="control" id="efficiencySelect">
          <option value="" selected>请选择</option>
          <option value="产品交叉比率">产品交叉比率</option>
          <option value="售罄率">售罄率</option>
          <option value="动销率">动销率</option>
        </select>
      </div>

      <div class="form-item">
        <label class="form-label">销售日期</label>
        <div class="dpr" id="dprSale">
          <button type="button" class="dpr-trigger"><span class="dpr-label">2026-07-01 ~ 2026-07-31</span><i class="fa-solid fa-calendar"></i></button>
          <div class="dpr-panel hidden">
            <div class="dpr-head">
              <button type="button" class="dpr-prev">&lt;</button>
              <span class="dpr-month"></span>
              <button type="button" class="dpr-next">&gt;</button>
            </div>
            <div class="dpr-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
            <div class="dpr-days"></div>
            <div class="dpr-foot">
              <button type="button" class="dpr-clear">清空</button>
              <button type="button" class="dpr-today">今天</button>
            </div>
          </div>
        </div>
      </div>
      <div class="form-item">
        <label class="form-label">对比日期</label>
        <div class="dpr" id="dprCompare">
          <button type="button" class="dpr-trigger"><span class="dpr-label">2026-06-01 ~ 2026-06-30</span><i class="fa-solid fa-calendar"></i></button>
          <div class="dpr-panel hidden">
            <div class="dpr-head">
              <button type="button" class="dpr-prev">&lt;</button>
              <span class="dpr-month"></span>
              <button type="button" class="dpr-next">&gt;</button>
            </div>
            <div class="dpr-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
            <div class="dpr-days"></div>
            <div class="dpr-foot">
              <button type="button" class="dpr-clear">清空</button>
              <button type="button" class="dpr-today">今天</button>
            </div>
          </div>
        </div>
      </div>
      <div class="form-item">
        <label class="form-label">星期时间</label>
        <select class="control" id="filterWeek">
          <option>星期一</option>
          <option>星期二</option>
          <option>星期三</option>
          <option>星期四</option>
          <option>星期五</option>
          <option>星期六</option>
          <option>星期日</option>
        </select>
      </div>
      <div class="form-item">
        <label class="form-label">业务模式</label>
        <select class="control" id="filterBizMode">
          <option>全部</option>
          <option>自营</option>
          <option>联营</option>
          <option>平台</option>
          <option>代销</option>
        </select>
      </div>
      <div class="form-item">
        <label class="form-label">业务品类</label>
        <select class="control" id="filterBizCategory">
          <option>全部</option>
          <option>护肤</option>
          <option>彩妆</option>
          <option>香水</option>
          <option>保健食品</option>
          <option>酒类</option>
          <option>珠宝</option>
          <option>腕表</option>
        </select>
      </div>

      <div class="form-item">
        <label class="form-label">内部分类</label>
        <div class="msel" id="mselInternal">
          <button type="button" class="msel-trigger"><span class="msel-label">全部</span><i class="fa-solid fa-angle-down"></i></button>
          <div class="msel-panel hidden">
            <div class="msel-head">
              <label class="msel-all-row"><input type="checkbox" class="msel-all" checked> 全选</label>
              <button type="button" class="msel-clear">清空</button>
            </div>
            <div class="msel-list"></div>
          </div>
        </div>
      </div>
      <div class="form-item">
        <label class="form-label">商品分类</label>
        <select class="control" id="filterCategory">
          <option>全部</option>

      let view = new Date(start.getFullYear(), start.getMonth(), 1);

      function render(){
        monthEl.textContent = `${view.getFullYear()}年${view.getMonth()+1}月`;
        const first = new Date(view.getFullYear(), view.getMonth(), 1);
        const dow = first.getDay();
        const daysInMonth = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
        let html = '';
        for (let i=0;i<dow;i++) html += '<span class="dpr-empty"></span>';
        for (let d=1;d<=daysInMonth;d++){
          const date = new Date(view.getFullYear(), view.getMonth(), d);
          const t = date.getTime();
          let cls = 'dpr-day';
          if (start && end && t >= start.getTime() && t <= end.getTime()) cls += ' in-range';
          if (start && t === start.getTime()) cls += ' start';
          if (end && t === end.getTime()) cls += ' end';
          html += `<button type="button" class="${cls}" data-date="${fmtYmd(date)}">${d}</button>`;
        }
        daysEl.innerHTML = html;
      }
      function update(){
        label.textContent = start && end ? `${fmtYmd(start)} ~ ${fmtYmd(end)}` : (start ? `${fmtYmd(start)} ~` : '请选择日期');
      }
      trigger.addEventListener('click', e => {
        e.stopPropagation();
        const isOpen = root.classList.contains('open');
        document.querySelectorAll('.dpr.open').forEach(m => m.classList.remove('open'));
        if (!isOpen) root.classList.add('open');
      });
      panel.addEventListener('click', e => e.stopPropagation());
      prevBtn.addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth()-1, 1); render(); });
      nextBtn.addEventListener('click', () => { view = new Date(view.getFullYear(), view.getMonth()+1, 1); render(); });
      daysEl.addEventListener('click', e => {
        const btn = e.target.closest('.dpr-day');
        if (!btn) return;
        const d = parseYmd(btn.dataset.date);
        if (!start || (start && end)) {
          start = d; end = null;
        } else if (d.getTime() < start.getTime()) {
          start = d;
        } else {
          end = d;
        }
        update();
        render();
      });
      clearBtn.addEventListener('click', () => { start = null; end = null; update(); render(); });
      todayBtn.addEventListener('click', () => {
        const t = new Date();
        t.setHours(0,0,0,0);
        start = t; end = t; update(); render();
      });
      dprInstances[cfg.id] = {
        reset(){ start = parseYmd(cfg.start); end = parseYmd(cfg.end); update(); render(); },
        get(){ return {start: start ? fmtYmd(start) : '', end: end ? fmtYmd(end) : ''}; }
      };
      update();
      render();
    });
    document.addEventListener('click', () => document.querySelectorAll('.dpr.open').forEach(m => m.classList.remove('open')));
  }

  function overlayOptionsFor(analysis){
    let base = OVERLAY_DIMS.slice();
    if (analysis === '单品') {
      base = base.filter(d => SINGLE_OVERLAY_ALLOW.includes(d));
    } else if (isIntervalDim(analysis)) {
      base = base.filter(d => d !== '单品');
    }
    return base.filter(d => d !== analysis);
  }

  function rebuildOverlayOptions(){
    const analysis = analysisSelect.value;
    const opts = overlayOptionsFor(analysis);
    const current = overlaySelect.value;
    overlaySelect.innerHTML = '<option value="">不叠加</option>' + opts.map(d => `<option value="${d}">${d}</option>`).join('');
    overlaySelect.value = opts.includes(current) ? current : '';
  }

  function buildColumns(){
    const analysis = analysisSelect.value;
    const overlay = overlaySelect.value;
    const eff = efficiencySelect.value;
    const interval = isIntervalDim(analysis);
    const cols = [];
    const common = COMMON_FIELDS.map(f => Object.assign({}, f));
    const effCols = EFFICIENCY_FIELDS[eff] ? EFFICIENCY_FIELDS[eff].map(f => Object.assign({}, f)) : [];

    if (analysis === '单品') {
      cols.push({key:'商品编码', label:'商品编码', type:'text'});
      if (overlay) cols.push({key:'叠加', label:overlay, type:'text'});
      cols.push({key:'商品名称', label:'商品名称', type:'text'});
      cols.push({key:'类别', label:'类别', type:'text'});
      cols.push({key:'内部小类', label:'内部小类', type:'text'});
      cols.push({key:'内部中类', label:'内部中类', type:'text'});
      cols.push({key:'内部大类', label:'内部大类', type:'text'});
      cols.push({key:'品牌', label:'品牌', type:'text'});
      cols.push({key:'商品大类', label:'商品大类', type:'text'});
      cols.push(...common);
      if (!interval && effCols.length) cols.push(...effCols);
    } else if (interval) {
      cols.push({key:analysis, label:analysis, type:'text'});
      if (overlay) cols.push({key:'叠加', label:overlay, type:'text'});
      cols.push(...common.filter(f => !['购物人数','票数','客单价','件单价','连带率'].includes(f.label)));
      cols.push(...EXTRA_INTERVAL_FIELDS
        .filter(f => !(overlay === '品牌' && (f.label === '品牌数量' || f.label === '品牌数量占比')))
        .map(f => Object.assign({}, f)));
    } else {
      cols.push({key:analysis, label:analysis, type:'text'});
      if (overlay) cols.push({key:'叠加', label:overlay, type:'text'});
      cols.push(...common);
      if (effCols.length) cols.push(...effCols);
    }
    return cols;
  }

  function intervalLabels(){
    const analysis = analysisSelect.value;
    const seg = +segmentSelect.value;
    const step = 100 / seg;
    const labels = [];
    for (let i=0;i<seg;i++){
      const lo = step*i;
      const hi = step*(i+1);
      labels.push(lo === 0 ? `0-${hi}%` : `${lo}%-${hi}%`);
    }
    return labels;
  }

  function dimPool(dim){
    const selectedStores = getMulti('mselStore');
    const selectedControls = getMulti('mselControl');
    if (dim === '品牌' && $('#filterBrand').value !== '全部') return [$('#filterBrand').value];
    if (dim === '门店' && selectedStores.length) return selectedStores;
    if (dim === '控制分类' && selectedControls.length) return selectedControls;
    return POOL[dim] || [dim];
  }

  function generateRow(index, labels){
    const analysis = analysisSelect.value;
    const overlay = overlaySelect.value;
    const eff = efficiencySelect.value;
    const interval = isIntervalDim(analysis);
    const row = {};
    let bucketIdx = -1;

    if (interval) {
      bucketIdx = randInt(0, labels.length-1);
      row[analysis] = labels[bucketIdx];
    } else if (analysis === '单品') {
      row['商品编码'] = 'SP' + (202607000 + index + 1);
      row['商品名称'] = pick(PRODUCT_NAMES);
      row['类别'] = pick(CATEGORIES);
      row['内部小类'] = pick(SMALL_CLASSES);
      row['内部中类'] = pick(MID_CLASSES);
      row['内部大类'] = pick(BIG_CLASSES);
      row['品牌'] = pick(dimPool('品牌'));
      row['商品大类'] = pick(POOL['商品大类(海南)']);
    } else {
      row[analysis] = pick(dimPool(analysis));
    }
    if (overlay) row['叠加'] = pick(POOL[overlay] || [overlay]);

    const scale = bucketIdx >= 0 ? 0.5 + bucketIdx*0.45 : 1;
    const qty = Math.max(1, Math.round(randInt(1,600)*scale));
    const unitPrice = rand(20,9000,2) * (bucketIdx >= 0 ? rand(1,3) : 1);
    const saleAmount = round2(qty*unitPrice);
    const discountRate = rand(0.03,0.3);
    const totalDiscount = round2(saleAmount*discountRate);
    const salesRevenue = round2(saleAmount - totalDiscount);
    const operatingRevenue = round2(salesRevenue*rand(0.92,1));
    const taxFreeRevenue = round2(operatingRevenue*rand(0.05,0.85));
    const cost = round2(saleAmount*rand(0.3,0.65));
    const bizProfit = round2(salesRevenue - cost);
    const couponAmount = round2(salesRevenue*rand(0,0.06));
    const douyinCoupon = round2(salesRevenue*rand(0,0.04));
    const pointsUsed = randInt(0, Math.max(1, Math.round(salesRevenue/25)));
    const pointsRefund = randInt(0, Math.max(1, Math.round(salesRevenue/80)));
    const actualProfit = round2(Math.max(0, bizProfit - couponAmount - douyinCoupon*0.5 - pointsUsed*0.01 + pointsRefund));
    const netProfit = round2(actualProfit*rand(0.86,0.99));
    const customers = randInt(1,220);
    const tickets = randInt(1, Math.max(1, Math.round(customers*rand(0.7,1.2))));

    row['售价金额'] = saleAmount;
    row['销售收入'] = salesRevenue;
    row['营业收入'] = operatingRevenue;
    row['免税营收(海南)'] = taxFreeRevenue;
    row['总折扣'] = totalDiscount;
    row['成本金额'] = cost;
    row['折扣率'] = round2(discountRate*100);
    row['业务毛利'] = bizProfit;
    row['业务毛利率'] = round2(salesRevenue > 0 ? bizProfit/salesRevenue*100 : 0);
    row['实际毛利'] = actualProfit;
    row['实际毛利率'] = round2(salesRevenue > 0 ? actualProfit/salesRevenue*100 : 0);
    row['净毛利'] = netProfit;
    row['净毛利率'] = round2(salesRevenue > 0 ? netProfit/salesRevenue*100 : 0);
    row['用券金额'] = couponAmount;
    row['抖音券优惠金额(海南)'] = douyinCoupon;
    row['用积分金额'] = pointsUsed;
    row['积分补款'] = pointsRefund;
    row['购物人数'] = customers;
    row['客单价'] = round2(salesRevenue/Math.max(1,customers));
    row['票数'] = tickets;
    row['件单价'] = round2(saleAmount/Math.max(1,qty));
    row['销售数量'] = qty;
    row['连带率'] = round2(qty/Math.max(1,tickets));
    row['销售收入占比'] = rand(0.2,12);
    row['基础等级赠送积分'] = randInt(0,8000);
    row['倍数营销赠送积分'] = randInt(0,12000);
    row['满返营销赠送积分'] = randInt(0,10000);
    row['赠送积分总额'] = row['基础等级赠送积分'] + row['倍数营销赠送积分'] + row['满返营销赠送积分'];

    if (interval) {
      row['品牌数量'] = randInt(1,80);
      row['品牌数量占比'] = rand(0.05,30);
      row['SKU数量'] = randInt(1,600);
      row['SKU数量占比'] = rand(0.05,30);
      row['销售占比'] = rand(0.05,30);
      row['毛利占比'] = rand(0.05,30);
      row['库存占比'] = rand(0.05,30);
    } else if (eff === '产品交叉比率') {
      row['产品交叉率'] = rand(1,80);
    } else if (eff === '售罄率') {
      row['正价平均折扣'] = rand(70,98);
      row['非正价平均折扣'] = rand(40,85);
      row['售罄率'] = rand(20,90);
      row['正价售罄率'] = rand(15,80);
      row['非正价售罄率'] = rand(5,60);
      row['正价销售占比'] = rand(30,85);
      row['非正价销售占比'] = round2(100 - row['正价销售占比']);
      row['正价毛利占比'] = rand(35,85);
      row['非正价毛利占比'] = round2(100 - row['正价毛利占比']);
    } else if (eff === '动销率') {
      row['SKU动销率'] = rand(15,95);
      row['动销SKU数量'] = randInt(50,5000);
      row['非动销SKU数量'] = randInt(20,2000);
      row['动销库存占比'] = rand(20,90);
      row['非动销库存占比'] = round2(100 - row['动销库存占比']);
    }
    return row;
  }

  function refreshData(){
    const count = randInt(20,30);
    const labels = isIntervalDim(analysisSelect.value) ? intervalLabels() : [];
    currentData = [];
    for (let i=0;i<count;i++) currentData.push(generateRow(i, labels));
    page = 1;
    renderTable();
  }

  function formatCell(value, type){
    if (value === null || value === undefined || value === '') return '';
    if (type === 'money') return Number(value).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    if (type === 'percent') return Number(value).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%';
    if (type === 'int') return Number(value).toLocaleString('en-US');
    if (type === 'decimal') return Number(value).toFixed(2);
    return String(value);
  }

  function pageItems(pageCount){
    if (pageCount <= 7) return Array.from({length:pageCount}, (_,i)=>i+1);
    const set = new Set([1,2,pageCount-1,pageCount,page-1,page,page+1].filter(p => p>=1 && p<=pageCount));
    const sorted = [...set].sort((a,b)=>a-b);
    const out = [];
    for (let i=0;i<sorted.length;i++){
      if (i>0 && sorted[i]-sorted[i-1] > 1) out.push('...');
      out.push(sorted[i]);
    }
    return out;
  }

  function renderTable(){
    const cols = buildColumns();
    const overlay = overlaySelect.value;
    const stickyCount = overlay ? 2 : 1;
    const total = currentData.length;
    const pageCount = Math.max(1, Math.ceil(total/pageSize));
    if (page > pageCount) page = pageCount;
    const start = (page-1)*pageSize;
    const slice = currentData.slice(start, start+pageSize);

    let html = '<thead><tr>';
    cols.forEach((c,i)=>{
      const sticky = i < stickyCount ? ` sticky sticky-${i+1}` : '';
      const align = c.type === 'text' ? '' : ' num';
      const changed = CHANGED_HEADERS.has(c.label) ? ' changed' : '';
      html += `<th class="${sticky}${align}${changed}">${c.label}</th>`;
    });
    html += '</tr></thead><tbody>';
    const totals = {};
    cols.forEach((c, i) => {
      if (c.type === 'text') {
        totals[c.key] = i === 0 ? '合计' : '';
      } else if (c.type === 'percent' || c.type === 'decimal') {
        const vals = currentData.map(r => Number(r[c.key])).filter(v => isFinite(v));
        totals[c.key] = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
      } else {
        totals[c.key] = currentData.reduce((a, r) => a + (Number(r[c.key]) || 0), 0);
      }
    });
    html += '<tr class="total-row">';
    cols.forEach((c, i) => {
      const sticky = i < stickyCount ? ` sticky sticky-${i+1}` : '';
      const align = c.type === 'text' ? '' : ' num';
      html += `<td class="${sticky}${align}">${formatCell(totals[c.key], c.type)}</td>`;
    });
    html += '</tr>';
    slice.forEach(row=>{
      html += '<tr>';
      cols.forEach((c,i)=>{
        const sticky = i < stickyCount ? ` sticky sticky-${i+1}` : '';
        const align = c.type === 'text' ? '' : ' num';
        html += `<td class="${sticky}${align}">${formatCell(row[c.key], c.type)}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody>';
    dataTable.innerHTML = html;

    totalCount.textContent = total;

    prevBtn.disabled = page <= 1;
    nextBtn.disabled = page >= pageCount;
    pageNumbers.innerHTML = pageItems(pageCount).map(item => {
      if (item === '...') return '<span class="page-ellipsis">…</span>';
      return `<button class="page-num ${item === page ? 'active' : ''}" data-page="${item}">${item}</button>`;
    }).join('');
    goInput.max = pageCount;
    goInput.value = page;
  }

  function onAnalysisChange(){
    rebuildOverlayOptions();
    const interval = isIntervalDim(analysisSelect.value);
    segmentSelect.disabled = !interval;
    grossMin.disabled = !interval;
    grossMax.disabled = !interval;
    filterDiscount.disabled = interval;
    efficiencySelect.disabled = interval;
    segmentLabel.textContent = analysisSelect.value === '销售额区间' ? '销售区间分段' : '毛利区间分段';
    refreshData();
  }

  function resetFilters(){
    resetMultiSelect('mselChannel');
    resetMultiSelect('mselStore');
    resetMultiSelect('mselControl');
    resetMultiSelect('mselInternal');
    $('#filterCategory').value = '全部';
    $('#filterBizMode').value = '全部';
    $('#filterBizCategory').value = '全部';
    $('#filterBrand').value = '全部';
    $('#filterGoodsCode').value = '';
    $('#priceMin').value = '';
    $('#priceMax').value = '';
    $('#filterDelivery').value = '全部';
    $('#filterGoodsScope').value = '全部';
    dprInstances['dprSale'].reset();
    dprInstances['dprCompare'].reset();
    $('#filterWeek').value = '星期一';
    $('#filterIsland').value = '全部';
    $('#filterOrderType').value = '全部';
    $('#filterSaleChannel').value = '全部';
    $('#filterCustomerSource').selectedIndex = 0;
    $('#filterSupplier').value = '全部';
    $('#filterDiscount').value = '';
    document.querySelector('input[name="currency"][value="人民币"]').checked = true;
    document.querySelector('input[name="language"][value="中文"]').checked = true;
    analysisSelect.value = '品牌';
    segmentSelect.value = '10';
    efficiencySelect.value = '';
    $('#grossMin').value = '';
    $('#grossMax').value = '';
    onAnalysisChange();
  }

  function exportCsv(){
    const cols = buildColumns();
    const head = cols.map(c => `"${c.label}"`).join(',');
    const lines = currentData.map(row => cols.map(c => {
      const v = formatCell(row[c.key], c.type);
      return `"${String(v).replace(/"/g,'""')}"`;
    }).join(','));
    const csv = '\ufeff' + [head, ...lines].join('\r\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `销售分析_${analysisSelect.value}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  initMultiSelects();
  initDateRangePickers();
  fillAnalysisOptions();
  onAnalysisChange();

  analysisSelect.addEventListener('change', onAnalysisChange);
  overlaySelect.addEventListener('change', refreshData);
  efficiencySelect.addEventListener('change', refreshData);
  segmentSelect.addEventListener('change', refreshData);
  $('#queryBtn').addEventListener('click', refreshData);
  $('#resetBtn').addEventListener('click', resetFilters);
  $('#exportBtn').addEventListener('click', exportCsv);

  pageSizeSelect.addEventListener('change', () => {
    pageSize = +pageSizeSelect.value;
    page = 1;
    renderTable();
  });
  prevBtn.addEventListener('click', () => {
    if (page > 1){ page--; renderTable(); }
  });
  nextBtn.addEventListener('click', () => {
    const pageCount = Math.max(1, Math.ceil(currentData.length/pageSize));
    if (page < pageCount){ page++; renderTable(); }
  });
  pageNumbers.addEventListener('click', e => {
    const btn = e.target.closest('.page-num');
    if (!btn) return;
    page = +btn.dataset.page;
    renderTable();
  });
  function goToPage(){
    const target = Math.min(Math.max(1, +goInput.value || 1), Math.max(1, Math.ceil(currentData.length/pageSize)));
    page = target;
    renderTable();
  }
  goBtn.addEventListener('click', goToPage);
  goInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') goToPage();
  });
})();
</script>
</body>
</html>
